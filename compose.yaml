name: celloras
services:
  openshell-init:
    profiles: [agent-docker]
    image: ghcr.io/nvidia/openshell/gateway:0.1.5
    user: "${CELLORAS_WORKER_UID:-1000}:${CELLORAS_WORKER_GID:-1000}"
    command:
      [
        "generate-certs",
        "--output-dir",
        "${OPENSHELL_STATE_DIR:-/var/lib/celloras-openshell}/tls",
        "--server-san",
        "openshell",
        "--server-san",
        "host.openshell.internal",
        "--server-san",
        "host.docker.internal",
      ]
    volumes:
      - ${OPENSHELL_STATE_DIR:-/var/lib/celloras-openshell}:${OPENSHELL_STATE_DIR:-/var/lib/celloras-openshell}
  openshell:
    profiles: [agent-docker]
    image: ghcr.io/nvidia/openshell/gateway:0.1.5
    user: "0"
    command: ["--bind-address", "0.0.0.0", "--port", "17670"]
    restart: unless-stopped
    ports: ["127.0.0.1:17670:17670"]
    environment:
      OPENSHELL_GATEWAY_CONFIG: ${OPENSHELL_STATE_DIR:-/var/lib/celloras-openshell}/gateway.toml
      OPENSHELL_DB_URL: sqlite:${OPENSHELL_STATE_DIR:-/var/lib/celloras-openshell}/gateway.db?mode=rwc
      OPENSHELL_LOCAL_TLS_DIR: ${OPENSHELL_STATE_DIR:-/var/lib/celloras-openshell}/tls
      OPENSHELL_GRPC_ENDPOINT: https://host.openshell.internal:17670
      XDG_DATA_HOME: ${OPENSHELL_STATE_DIR:-/var/lib/celloras-openshell}
      XDG_STATE_HOME: ${OPENSHELL_STATE_DIR:-/var/lib/celloras-openshell}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENSHELL_STATE_DIR:-/var/lib/celloras-openshell}:${OPENSHELL_STATE_DIR:-/var/lib/celloras-openshell}
    depends_on:
      openshell-init: { condition: service_completed_successfully }
  agent-worker:
    profiles: [agent]
    build: { context: ., dockerfile: infra/agent/Dockerfile }
    user: "${CELLORAS_WORKER_UID:-1000}:${CELLORAS_WORKER_GID:-1000}"
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      DATABASE_URL: postgresql://celloras:${APP_DB_PASSWORD:?Required}@postgres:5432/celloras
      XDG_CONFIG_HOME: /config
      XDG_STATE_HOME: /tmp/celloras-state
      XDG_CACHE_HOME: /tmp/celloras-cache
      OPENSHELL_GATEWAY: celloras
      CELLORAS_AGENT_METADATA_FILE: /run/celloras/metadata.json
      CELLORAS_AGENT_IMAGE: ${CELLORAS_AGENT_IMAGE:-celloras-codex:0.163.0-annotation1}
      CELLORAS_AGENT_PROVIDER: ${CELLORAS_AGENT_PROVIDER:-celloras-codex}
      CELLORAS_AGENT_MODEL: ${CELLORAS_AGENT_MODEL:-}
      CELLORAS_AGENT_RUNTIME: ${CELLORAS_AGENT_RUNTIME:-openshell}
      CELLORAS_INVESTIGATION_ENABLED: ${CELLORAS_INVESTIGATION_ENABLED:-false}
      NIGHTSHIFT_API_URL: ${NIGHTSHIFT_API_URL:-}
      NIGHTSHIFT_API_TOKEN: ${NIGHTSHIFT_API_TOKEN:-}
      NIGHTSHIFT_MODEL: ${NIGHTSHIFT_MODEL:-}
      CELLORAS_REFERENCE_PROVIDER: ${CELLORAS_REFERENCE_PROVIDER:-published}
      ZETARIS_API_URL: ${ZETARIS_API_URL:-}
      ZETARIS_ALLOW_PRIVATE_HTTP: ${ZETARIS_ALLOW_PRIVATE_HTTP:-false}
      ZETARIS_API_TOKEN: ${ZETARIS_API_TOKEN:-}
      ZETARIS_ORG_ID: ${ZETARIS_ORG_ID:-}
      ZETARIS_REFERENCE_TABLE: ${ZETARIS_REFERENCE_TABLE:-}
      CELLORAS_UPLOADED_DATASET_DIR: /uploaded-datasets
      CELLORAS_DATASET_DIR: /datasets
    volumes:
      - ${CELLORAS_UPLOADED_DATASET_DIR:-./.artifacts/uploaded-datasets}:/uploaded-datasets:ro
      - ${CELLORAS_DATASET_DIR:-./.artifacts/scientific-data}:/datasets:ro
      - ${OPENSHELL_CONFIG_DIR:-./.artifacts/openshell/worker-config}:/config
      - ${CELLORAS_AGENT_METADATA_FILE:-./.artifacts/openshell/agent-metadata.json}:/run/celloras/metadata.json:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  upload-storage-init:
    image: node:22.22.0-bookworm-slim
    user: "0:0"
    environment:
      STORAGE_UID: ${CELLORAS_WORKER_UID:-1000}
      STORAGE_GID: ${CELLORAS_WORKER_GID:-1000}
    command:
      [
        "node",
        "-e",
        "const f=require('fs');for(const p of ['/uploads','/uploaded-datasets']){f.mkdirSync(p,{recursive:true});f.chownSync(p,Number(process.env.STORAGE_UID),Number(process.env.STORAGE_GID));f.chmodSync(p,0o700)}",
      ]
    volumes:
      - ${CELLORAS_UPLOAD_DIR:-./.artifacts/dataset-uploads}:/uploads
      - ${CELLORAS_UPLOADED_DATASET_DIR:-./.artifacts/uploaded-datasets}:/uploaded-datasets
  h5ad-importer:
    build: { context: ., dockerfile: infra/science/h5ad/Dockerfile }
    user: "${CELLORAS_WORKER_UID:-1000}:${CELLORAS_WORKER_GID:-1000}"
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 4g
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgresql://celloras:${APP_DB_PASSWORD:?Required}@postgres:5432/celloras
      CELLORAS_UPLOAD_DIR: /uploads
      CELLORAS_UPLOADED_DATASET_DIR: /uploaded-datasets
      CELLORAS_H5AD_TIMEOUT_SECONDS: 900
      CELLORAS_H5AD_MEMORY_GIB: 3
    volumes:
      - ${CELLORAS_UPLOAD_DIR:-./.artifacts/dataset-uploads}:/uploads
      - ${CELLORAS_UPLOADED_DATASET_DIR:-./.artifacts/uploaded-datasets}:/uploaded-datasets
    depends_on:
      migrate: { condition: service_completed_successfully }
      upload-storage-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,time;h=json.load(open('/uploads/.worker-health.json'));assert h['status']=='ready' and time.time()-h['updatedAt']<45",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run npm run setup first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command:
      - start-dev
      - --import-realm
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Required}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Required}
      CELLORAS_APP_URL: http://localhost:3100
      CELLORAS_DEMO_EMAIL: ${CELLORAS_DEMO_EMAIL:-}
      CELLORAS_DEMO_PASSWORD: ${CELLORAS_DEMO_PASSWORD:-}
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/celloras-realm.json:ro
      - ./infra/keycloak/themes/celloras:/opt/keycloak/themes/celloras:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; head -n 1 <&3 | grep -q '200'",
        ]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 20
  migrate:
    build: { context: ., target: dependencies }
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://celloras:${APP_DB_PASSWORD:?Required}@postgres:5432/celloras
    volumes:
      - ./scripts/migrate.mjs:/app/scripts/migrate.mjs:ro
      - ./db:/app/db:ro
    depends_on:
      postgres: { condition: service_healthy }
  app:
    user: "${CELLORAS_WORKER_UID:-1000}:${CELLORAS_WORKER_GID:-1000}"
    build: { context: ., target: runtime }
    environment:
      CELLORAS_H5AD_DEMO_FILE: ${CELLORAS_H5AD_DEMO_FILE:-}
      CELLORAS_H5AD_DEMO_SHA256: ${CELLORAS_H5AD_DEMO_SHA256:-}
      CELLORAS_UPLOAD_DIR: /uploads
      CELLORAS_UPLOADED_DATASET_DIR: /uploaded-datasets
      CELLORAS_DATASET_DIR: /datasets
      CELLORAS_AGENT_RUNTIME: ${CELLORAS_AGENT_RUNTIME:-openshell}
      CELLORAS_INVESTIGATION_ENABLED: ${CELLORAS_INVESTIGATION_ENABLED:-false}
      CELLORAS_REFERENCE_PROVIDER: ${CELLORAS_REFERENCE_PROVIDER:-published}
      ZETARIS_API_URL: ${ZETARIS_API_URL:-}
      ZETARIS_ALLOW_PRIVATE_HTTP: ${ZETARIS_ALLOW_PRIVATE_HTTP:-false}
      ZETARIS_API_TOKEN: ${ZETARIS_API_TOKEN:-}
      ZETARIS_ORG_ID: ${ZETARIS_ORG_ID:-}
      ZETARIS_REFERENCE_TABLE: ${ZETARIS_REFERENCE_TABLE:-}
      APP_ENV: local
      APP_URL: http://localhost:3100
      DATABASE_URL: postgresql://celloras:${APP_DB_PASSWORD:?Required}@postgres:5432/celloras
      KEYCLOAK_ISSUER: http://localhost:8180/realms/celloras
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/celloras
      KEYCLOAK_CLIENT_ID: celloras
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Required}
    volumes:
      - ${CELLORAS_UPLOAD_DIR:-./.artifacts/dataset-uploads}:/uploads
      - ${CELLORAS_UPLOADED_DATASET_DIR:-./.artifacts/uploaded-datasets}:/uploaded-datasets:ro
      - ${CELLORAS_DATASET_DIR:-./.artifacts/scientific-data}:/datasets:ro
    ports: ["127.0.0.1:3100:3100"]
    depends_on:
      upload-storage-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
volumes:
  postgres-data:
