name: celloras
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run npm run setup first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command:
      - start-dev
      - --import-realm
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Required}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Required}
      CELLORAS_APP_URL: http://localhost:3100
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/celloras-realm.json:ro
      - ./infra/keycloak/themes/celloras:/opt/keycloak/themes/celloras:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; head -n 1 <&3 | grep -q '200'",
        ]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 20
  migrate:
    build: { context: ., target: dependencies }
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://celloras:${APP_DB_PASSWORD:?Required}@postgres:5432/celloras
    volumes:
      - ./scripts/migrate.mjs:/app/scripts/migrate.mjs:ro
      - ./db:/app/db:ro
    depends_on:
      postgres: { condition: service_healthy }
  app:
    build: { context: ., target: runtime }
    environment:
      APP_ENV: local
      APP_URL: http://localhost:3100
      DATABASE_URL: postgresql://celloras:${APP_DB_PASSWORD:?Required}@postgres:5432/celloras
      KEYCLOAK_ISSUER: http://localhost:8180/realms/celloras
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/celloras
      KEYCLOAK_CLIENT_ID: celloras
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Required}
    ports: ["127.0.0.1:3100:3100"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
volumes:
  postgres-data:
