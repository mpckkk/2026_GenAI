<title>Celloras · Technical workflow</title>
<style>
  :root { color-scheme:light; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:#000; font-family:Arial,Helvetica,sans-serif; }
  main { width:min(100%, calc((100svh - 88px) * 16 / 9 + 32px)); margin:auto; padding:16px; }
  .zoom { position:fixed; right:16px; bottom:16px; display:flex; gap:6px; }
  .zoom button { width:40px; height:40px; border:1px solid #000; border-radius:4px; background:#fff; color:#000; font:24px Arial,sans-serif; cursor:pointer; }
  .zoom button:disabled { opacity:.35; cursor:default; }
  .zoom button:focus-visible { outline:2px solid #000; outline-offset:3px; }
  svg { display:block; width:100%; height:auto; }
  svg text { font-family:Arial,Helvetica,sans-serif; fill:#000; }
  .node-surface { fill:#fff; stroke:#000; stroke-width:1.5; }
  .node-title { font-size:22px; font-weight:600; }
  .node-sub { font-size:17px; }
  .edge { fill:none; stroke:#000; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .edge.record { stroke-dasharray:5 7; }
  .edge-label { font-size:16px; paint-order:stroke fill; stroke:#fff; stroke-width:7px; stroke-linejoin:round; }
  .branch { font-weight:600; }
  @media (max-width:700px) { main { padding:16px; } }
  @media print { @page { size:A3 landscape; margin:10mm; } main { padding:0; width:100%!important; } .zoom { display:none; } svg { max-height:230mm; } }
</style>

<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="diagram" viewBox="0 130 1600 900" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Celloras request and analysis flow</title>
      <desc id="diagram-desc">A researcher submits an owned request. The Node.js orchestrator prepares context, calls a runtime adapter and executes requested scientific tools. OpenShell/Codex is the active conversation runtime behind a replaceable CLI or HTTP interface. An optional guided investigation checks an owned annotation and its dataset version, queries the same Zetaris marker reference and measures per-cell marker co-detection. A separate Nightshift HTTP adapter compares three interpretations of that fixed evidence. The orchestrator validates and returns a separate review without another CLI call or changing the original annotation. Nightshift runs that comparison on NVIDIA Nemotron 3 Ultra through cloud lanes; the investigation is live. Prepared H5AD import preserves existing groups and UMAP. Numerical tools read private files; Zetaris supplies the marker reference. Results and evidence return to the agent. Explicit researcher reviews are saved in PostgreSQL, then recalled on later requests by H-MEM inside the orchestrator. Results and activity are persisted; the dashboard reads recorded activity. The main path shows the successful agent-requested tool loop. Guided actions can execute a tool before the first model call; completed investigations go straight to a visual review. All paths record their actions, timing, sources and outcomes in the same activity dashboard.</desc>

<div class="zoom" role="group" aria-label="Zoom controls">

<script>
  const chart = document.querySelector('main');
  const zoomOut = document.getElementById('zoom-out');
  const zoomIn = document.getElementById('zoom-in');
  let zoom = 1;
  function resizeChart() {
    const availableHeight = Math.max(1, window.innerHeight - 88);
    const fittedWidth = Math.min(document.documentElement.clientWidth, availableHeight * 16 / 9 + 32);
    chart.style.width = (fittedWidth - 32) * zoom + 32 + 'px';
    zoomOut.disabled = zoom <= 0.5;
    zoomIn.disabled = zoom >= 3;
  }
  zoomOut.addEventListener('click', () => { zoom = Math.max(0.5, zoom - 0.25); resizeChart(); });
  zoomIn.addEventListener('click', () => { zoom = Math.min(3, zoom + 0.25); resizeChart(); });
  window.addEventListener('resize', resizeChart);
  resizeChart();
</script>
