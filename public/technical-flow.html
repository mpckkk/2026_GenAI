<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Celloras · Technical workflow</title>
<style>
  :root { color-scheme:light; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:#000; font-family:Arial,Helvetica,sans-serif; }
  main { max-width:1700px; margin:auto; padding:16px; }
  .zoom { position:fixed; right:16px; bottom:16px; display:flex; gap:6px; }
  .zoom button { width:40px; height:40px; border:1px solid #000; border-radius:4px; background:#fff; color:#000; font:24px Arial,sans-serif; cursor:pointer; }
  .zoom button:disabled { opacity:.35; cursor:default; }
  .zoom button:focus-visible { outline:2px solid #000; outline-offset:3px; }
  svg { display:block; width:100%; height:auto; }
  svg text { font-family:Arial,Helvetica,sans-serif; fill:#000; }
  .node-surface { fill:#fff; stroke:#000; stroke-width:1.5; }
  .node-title { font-size:22px; font-weight:600; }
  .node-sub { font-size:17px; }
  .edge { fill:none; stroke:#000; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .edge.record { stroke-dasharray:5 7; }
  .edge-label { font-size:16px; paint-order:stroke fill; stroke:#fff; stroke-width:7px; stroke-linejoin:round; }
  .branch { font-weight:600; }
  @media (max-width:700px) { main { padding:16px; } }
  @media print { @page { size:A3 landscape; margin:10mm; } main { padding:0; width:100%!important; } .zoom { display:none; } svg { max-height:230mm; } }
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="diagram" viewBox="0 130 1600 900" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Celloras request and analysis flow</title>
      <desc id="diagram-desc">A researcher submits an owned request. The worker prepares context, consults an interchangeable agent runtime and executes requested scientific tools. Tools read private numerical data and Zetaris evidence. Results return to the agent until an answer is ready. Saved reviews inform later requests through H-MEM. Execution creates durable activity records.</desc>
      <defs>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#000" /></marker>
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#000" /></marker>
        <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#000" /></marker>
      </defs>
      <g id="edges" aria-hidden="true">
        <path class="edge" marker-end="url(#arrow-green)" d="M230 450H280" />
        <path class="edge" marker-end="url(#arrow-green)" d="M510 450H560" />
        <path class="edge" marker-end="url(#arrow-green)" d="M630 380V290" />
        <text class="edge-label" x="613" y="340" text-anchor="end">Context</text>
        <path class="edge" marker-end="url(#arrow-green)" d="M750 290V380" />
        <text class="edge-label" x="765" y="335">Action / answer</text>
        <path class="edge reference" marker-end="url(#arrow-purple)" d="M1040 205H900V350H790V380" />
        <text class="edge-label" x="918" y="257">Relevant</text><text class="edge-label" x="918" y="278">decisions</text>
        <path class="edge" marker-end="url(#arrow-green)" d="M820 450H875" />
        <path class="edge" marker-end="url(#arrow-green)" d="M1025 450H1080" />
        <text class="edge-label branch" x="1053" y="435" text-anchor="middle">NO</text>
        <path class="edge" marker-end="url(#arrow-green)" d="M1300 450H1360" />
        <path class="edge" marker-end="url(#arrow-green)" d="M950 515V670" />
        <text class="edge-label branch" x="968" y="573">YES</text>
        <path class="edge" marker-end="url(#arrow-green)" d="M850 670V570H790V520" />
        <text class="edge-label" x="832" y="606" text-anchor="end">Measured results</text>
        <path class="edge" marker-end="url(#arrow-green)" d="M220 730H270" />
        <path class="edge" marker-end="url(#arrow-green)" d="M490 730H540" />
        <path class="edge" marker-end="url(#arrow-green)" d="M720 730H800" />
        <path class="edge reference" marker-end="url(#arrow-purple)" d="M1160 730H1080" />
        <path class="edge" marker-end="url(#arrow-green)" d="M1465 510V680" />
        <text class="edge-label" x="1480" y="589">Review</text>
        <path class="edge reference" marker-end="url(#arrow-purple)" d="M1570 730H1590V205H1320" />
        <text class="edge-label" x="1450" y="188" text-anchor="middle">Available next time</text>
        <path class="edge record" marker-end="url(#arrow-muted)" d="M560 495H522V714 M522 746V870H1350V900" />
        <path class="edge record" d="M522 714Q508 730 522 746" />
        <text class="edge-label" x="540" y="854">Record execution</text>
        <path class="edge" marker-end="url(#arrow-green)" d="M1130 965H1080" />
      </g>
      <g id="nodes"><g class="node "><polygon points="44,400 230,400 216,500 30,500" class="node-surface" /><text class="node-title" x="130" y="444" text-anchor="middle">Ask a question</text><text class="node-sub" x="130" y="478" text-anchor="middle">or choose an action</text></g><g class="node "><rect x="280" y="400" width="230" height="100" rx="11" class="node-surface" /><text class="node-title" x="395" y="432" text-anchor="middle">Check access</text><text class="node-sub" x="395" y="466" text-anchor="middle">Next.js · Keycloak</text><text class="node-sub" x="395" y="490" text-anchor="middle">PostgreSQL queue</text></g><g class="node agent"><rect x="560" y="380" width="260" height="140" rx="11" class="node-surface" /><text class="node-title" x="690" y="444" text-anchor="middle">Celloras worker</text><text class="node-sub" x="690" y="478" text-anchor="middle">Context · tools · persistence</text></g><g class="node agent"><rect x="560" y="160" width="260" height="130" rx="11" class="node-surface" /><text class="node-title" x="690" y="193.5" text-anchor="middle">Agent runtime</text><text class="node-title" x="690" y="220.5" text-anchor="middle">interface</text><text class="node-sub" x="690" y="254.5" text-anchor="middle">CLI or HTTP</text><text class="node-sub" x="690" y="278.5" text-anchor="middle">Live: Codex via OpenShell</text></g><g class="node reference"><rect x="1040" y="150" width="280" height="110" rx="11" class="node-surface" /><text class="node-title" x="1180" y="199" text-anchor="middle">Meterless H-MEM</text><text class="node-sub" x="1180" y="233" text-anchor="middle">Earlier research decisions</text></g><g class="node decision"><polygon points="950,385 1025,450 950,515 875,450" class="node-surface" /><text class="node-title" x="950" y="446" text-anchor="middle">Run an</text><text class="node-title" x="950" y="473" text-anchor="middle">analysis?</text></g><g class="node "><rect x="1080" y="400" width="220" height="100" rx="11" class="node-surface" /><text class="node-title" x="1190" y="444" text-anchor="middle">Validate + save</text><text class="node-sub" x="1190" y="478" text-anchor="middle">Schema · owned result IDs</text></g><g class="node result"><rect x="1360" y="390" width="210" height="120" rx="11" class="node-surface" /><text class="node-title" x="1465" y="432" text-anchor="middle">Visual answer</text><text class="node-sub" x="1465" y="466" text-anchor="middle">Explanation · cell map</text><text class="node-sub" x="1465" y="490" text-anchor="middle">Plots · evidence cards</text></g><g class="node "><polygon points="44,680 220,680 206,780 30,780" class="node-surface" /><text class="node-title" x="125" y="724" text-anchor="middle">Upload H5AD</text><text class="node-sub" x="125" y="758" text-anchor="middle">Resumable chunks</text></g><g class="node "><rect x="270" y="680" width="220" height="100" rx="11" class="node-surface" /><text class="node-title" x="380" y="724" text-anchor="middle">Validate + import</text><text class="node-sub" x="380" y="758" text-anchor="middle">Python worker</text></g><g class="node "><path d="M540,686 C540,665 720,665 720,686 V774 C720,795 540,795 540,774 Z M540,686 C540,707 720,707 720,686" class="node-surface" /><text class="node-title" x="630" y="731" text-anchor="middle">Private dataset</text><text class="node-sub" x="630" y="765" text-anchor="middle">Counts + UMAP</text></g><g class="node agent"><rect x="800" y="670" width="280" height="120" rx="11" class="node-surface" /><text class="node-title" x="940" y="712" text-anchor="middle">Scientific tools</text><text class="node-sub" x="940" y="746" text-anchor="middle">Annotation · comparisons</text><text class="node-sub" x="940" y="770" text-anchor="middle">Gene plots · literature</text></g><g class="node reference"><rect x="1160" y="680" width="180" height="100" rx="11" class="node-surface" /><text class="node-title" x="1250" y="724" text-anchor="middle">Zetaris</text><text class="node-sub" x="1250" y="758" text-anchor="middle">Marker reference</text></g><g class="node "><rect x="1360" y="680" width="210" height="100" rx="11" class="node-surface" /><text class="node-title" x="1465" y="724" text-anchor="middle">Researcher review</text><text class="node-sub" x="1465" y="758" text-anchor="middle">Save or revise decision</text></g><g class="node result"><rect x="560" y="920" width="520" height="90" rx="11" class="node-surface" /><text class="node-title" x="820" y="959" text-anchor="middle">Activity dashboard</text><text class="node-sub" x="820" y="993" text-anchor="middle">Steps · timing · sources · outcomes</text></g><g class="node "><path d="M1130,916 C1130,895 1570,895 1570,916 V994 C1570,1015 1130,1015 1130,994 Z M1130,916 C1130,937 1570,937 1570,916" class="node-surface" /><text class="node-title" x="1350" y="956" text-anchor="middle">PostgreSQL</text><text class="node-sub" x="1350" y="990" text-anchor="middle">Queue · results · reviews · memory · activity</text></g></g>
    </svg>
</main>
<div class="zoom" role="group" aria-label="Zoom controls">
  <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
  <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
</div>
<script>
  const chart = document.querySelector('main');
  const zoomOut = document.getElementById('zoom-out');
  const zoomIn = document.getElementById('zoom-in');
  let zoom = 1;
  function resizeChart() {
    chart.style.maxWidth = 'none';
    chart.style.width = Math.min(document.documentElement.clientWidth, 1700) * zoom + 'px';
    zoomOut.disabled = zoom <= 0.5;
    zoomIn.disabled = zoom >= 3;
  }
  zoomOut.addEventListener('click', () => { zoom = Math.max(0.5, zoom - 0.25); resizeChart(); });
  zoomIn.addEventListener('click', () => { zoom = Math.min(3, zoom + 0.25); resizeChart(); });
  window.addEventListener('resize', resizeChart);
</script>
</body>
</html>
